name: gas_monitor
description: "Dashboard de gas con el fin de monitorear en tiempo real el estado de la vivienda desde cualquir parte y momento."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  permission_handler: ^12.0.1
  image_picker: 1.1.2
  go_router: 14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
